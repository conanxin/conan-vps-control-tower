name: Feature request
description: Suggest a lightweight read-only improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: User scenario
      description: What problem would this solve for a personal VPS or proxy node user?
    validations:
      required: true
  - type: dropdown
    id: read-only
    attributes:
      label: Does this stay read-only?
      options:
        - "Yes"
        - "No"
        - "Not sure"
    validations:
      required: true
  - type: dropdown
    id: proxy-impact
    attributes:
      label: Could this affect proxy services?
      options:
        - "No"
        - "Possibly"
        - "Yes"
    validations:
      required: true
  - type: dropdown
    id: low-resource
    attributes:
      label: Is it suitable for a low-resource VPS?
      options:
        - "Yes"
        - "Not sure"
        - "No"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Add non-sensitive details, examples, or tradeoffs.
