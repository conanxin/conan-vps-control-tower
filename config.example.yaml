server:
  host: "127.0.0.1"
  port: 3001

checks:
  interval_seconds: 30

system:
  disk_warning_percent: 80
  ram_warning_percent: 80
  load_warning_1m: 1.5

proxy:
  process_names:
    - "x-ui"
    - "3x-ui"
    - "xray"
  service_names:
    - "x-ui"
    - "3x-ui"
  ports:
    - 443
  panel:
    url: "http://127.0.0.1:2053"
    timeout_seconds: 3

traffic:
  monthly_limit_gb: 1000
  reset_day: 1
  warning_percent: 70
  degraded_percent: 85
  critical_percent: 95
  interfaces:
    - "auto"
  data_file: "data/traffic_state.json"
  note: "Local traffic is an estimate and may differ from provider billing."

domain:
  enabled: false
  names:
    - "example.com"
  expected_ips:
    - "203.0.113.10"
  timeout_seconds: 3

tls:
  enabled: false
  targets:
    - host: "example.com"
      port: 443
      server_name: "example.com"
      warning_days: 21
      critical_days: 7
      timeout_seconds: 5
