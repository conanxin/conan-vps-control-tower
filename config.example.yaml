server:
  host: "127.0.0.1"
  port: 3001

checks:
  interval_seconds: 30

system:
  disk_warning_percent: 80
  ram_warning_percent: 80
  load_warning_1m: 1.5

proxy:
  process_names:
    - "x-ui"
    - "3x-ui"
    - "xray"
  service_names:
    - "x-ui"
    - "3x-ui"
  ports:
    - 443
  panel:
    url: "http://127.0.0.1:2053"
    timeout_seconds: 3

traffic:
  monthly_limit_gb: 1000
  reset_day: 1
  warning_percent: 70
  degraded_percent: 85
  critical_percent: 95
  interfaces:
    - "auto"
  data_file: "data/traffic_state.json"
  note: "本地流量估算可能与服务商计费口径存在差异。"

domain:
  enabled: false
  names:
    - "example.com"
  expected_ips:
    - "203.0.113.10"
  timeout_seconds: 3

tls:
  enabled: false
  targets:
    - host: "example.com"
      port: 443
      server_name: "example.com"
      warning_days: 21
      critical_days: 7
      timeout_seconds: 5

alerts:
  enabled: false
  min_severity: "warning"
  cooldown_seconds: 1800
  send_recovery: true
  state_file: "data/alert_state.json"
  telegram:
    enabled: false
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"
    timeout_seconds: 5
  email:
    enabled: false
    smtp_host: "smtp.example.com"
    smtp_port: 587
    username: "${SMTP_USERNAME}"
    password: "${SMTP_PASSWORD}"
    from_addr: "alerts@example.com"
    to_addrs:
      - "you@example.com"
    use_tls: true
    timeout_seconds: 10

history:
  enabled: true
  data_file: "data/health_history.json"
  event_file: "data/event_log.json"
  max_snapshots: 2880
  max_events: 500
  min_record_interval_seconds: 60
  summary_window_hours: 24

management:
  enabled: true
  panel_name: "管理面板"
  panel_local_url: "https://127.0.0.1:2096"
  panel_public_url: "https://panel.conanxin.com"
  access_note: "建议通过 Cloudflare Access + 双重校验进行保护后访问。"
  open_in_new_tab: true
  show_local_target: true
  readonly_note: "Control Tower 只负责健康监测和管理入口，不读取或修改管理配置。"
